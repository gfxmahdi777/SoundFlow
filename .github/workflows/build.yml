name: Build SoundFlow Windows Installer (CI)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Tauri 2 App (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean any platform-specific lockfiles
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          if (Test-Path bun.lock) { Remove-Item bun.lock -Force }

      - name: Install frontend dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build Frontend Assets
        run: npm run build

      - name: Build Tauri 2 Windows Installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY secret provided; building unsigned CI artifacts."
            $ciConfigPath = "src-tauri/tauri.ci.conf.json"
            Set-Content -Path $ciConfigPath -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8NoBOM
            try {
              npx tauri build --config $ciConfigPath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              if (Test-Path $ciConfigPath) { Remove-Item $ciConfigPath -Force }
            }
          } else {
            npx tauri build
          }

      - name: Upload Windows NSIS (.exe) & MSI Installers as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundFlow-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/soundflow.exe
          if-no-files-found: warn
