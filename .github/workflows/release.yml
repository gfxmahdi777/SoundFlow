name: Release SoundFlow Windows App & Auto-Updater

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-tauri:
    name: Build & Publish Tauri v2 Release (.exe, .msi & latest.json)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tauri signing secret is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Missing GitHub Secret: TAURI_SIGNING_PRIVATE_KEY. Generate a key pair with 'npx tauri signer generate' and add the private key to Repository Secrets."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean any platform-specific lockfiles
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          if (Test-Path bun.lock) { Remove-Item bun.lock -Force }

      - name: Install frontend dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build, Sign & Publish GitHub Release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SoundFlow ${{ github.ref_name }}'
          releaseBody: 'Automated Windows Tauri v2 installer and signed auto-updater release (`latest.json`, `.exe`, `.msi`, `.sig`).'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
