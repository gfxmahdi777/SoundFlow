name: Release SoundFlow Windows App & Auto-Updater

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-tauri:
    name: Build & Publish Tauri v2 Release (.exe + latest.json)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clean any platform-specific lockfiles
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          if (Test-Path bun.lock) { Remove-Item bun.lock -Force }

      - name: Install frontend dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build and Release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SoundFlow ${{ github.ref_name }}'
          releaseBody: 'Automated Windows Tauri v2 installer and auto-updater release (`latest.json`, `.exe`, `.msi`, `.sig`).'
          releaseDraft: false
          prerelease: false
